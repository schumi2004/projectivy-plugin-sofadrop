# Fork-only: builds "Sofadrop Dev" (the debug build, com.rfmarcos.sofadrop.dev) from this dev branch,
# which installs next to the regular app, and publishes it as a GitHub release for the in-app updater.
# Everything fork-specific lives in this file, so branches made from main stay clean for upstream PRs.
name: Build Sofadrop Dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      release:
        description: "Publish this build as a GitHub release (offered by the in-app updater)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # only used to publish a release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Write local.properties with app credentials
        run: |
          echo "tmdb.appKey=${{ secrets.TMDB_APP_KEY }}" >> local.properties
          echo "trakt.clientId=${{ secrets.TRAKT_CLIENT_ID }}" >> local.properties
          # Turns on the in-app updater (GitHub releases of this repository) and the About QR code
          echo "source.url=https://github.com/${{ github.repository }}" >> local.properties

      # "<upstream version>.<run>": rises with every build, so each APK installs as an update and the
      # updater (which compares the numbers before any "-suffix") sees a newer release
      - name: Set the version
        run: |
          base=$(sed -n 's/^versionName = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          echo "VERSION_NAME=$base.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 1000))" >> "$GITHUB_ENV"

      # Every runner would otherwise make its own random debug key, and Android only installs an
      # update signed with the same key as the installed app
      - name: Use the fixed debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 is not set: the APK couldn't be installed over an earlier build"
            exit 1
          fi
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          mkdir -p ~/.android
          cp "$RUNNER_TEMP/debug.keystore" ~/.android/debug.keystore

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      # Version and key go in as Android Studio's injected properties, so build.gradle.kts stays as upstream has it
      - name: Build Sofadrop Dev
        run: |
          ./gradlew :app:assembleDebug --no-daemon \
            -Pandroid.injected.version.code="$VERSION_CODE" \
            -Pandroid.injected.version.name="$VERSION_NAME" \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      # The APK must carry the fixed key and this build's version, or it won't install as an update
      - name: Check the APK
        run: |
          apk=$(ls app/build/outputs/apk/debug/*.apk)
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          expected=$(keytool -list -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey \
            | sed -n 's/.*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')
          actual=$("$tools/apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          badging=$("$tools/aapt2" dump badging "$apk" | head -1)
          echo "APK certificate SHA-256: $actual"
          echo "$badging"
          if [ "$actual" != "$expected" ]; then
            echo "::error::The APK is not signed with the fixed debug key (expected $expected)"
            exit 1
          fi
          if ! echo "$badging" | grep -q "versionCode='$VERSION_CODE'"; then
            echo "::error::The APK doesn't have versionCode $VERSION_CODE"
            exit 1
          fi

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sofadrop-dev-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish the release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk sofadrop.apk
          gh release create "v$VERSION_NAME-dev" sofadrop.apk --target "$GITHUB_SHA" \
            --title "Sofadrop Dev $VERSION_NAME" --notes "Dev build $VERSION_NAME from ${GITHUB_SHA::7}"
